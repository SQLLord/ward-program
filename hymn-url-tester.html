    gap: 12px;
    flex-wrap: wrap;
    align-items: center;

  }
  .stat { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 20px; }
  .stat.passed { background: #16a34a; }
  .stat.failed { background: #dc2626; }
  .stat.skipped { background: #d97706; }

  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
    display: flex;
  }
  .progress-bar .bar-pass { background: #4ade80; transition: width 0.3s; }
  .progress-bar .bar-fail { background: #f87171; transition: width 0.3s; }
  .progress-bar .bar-skip { background: #fbbf24; transition: width 0.3s; }

  .controls {
    padding: 12px 24px;
    background: white;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input {
    flex: 1;
    min-width: 200px;
    padding: 7px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .controls select {
    padding: 7px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.9rem;
    background: white;
  }
  .btn-reset {
    padding: 7px 14px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .btn-reset:hover { background: #b91c1c; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  thead {
    background: #e2e8f0;
    position: sticky;
    top: 120px;
    z-index: 5;
  }
  th { padding: 8px 12px; text-align: left; font-weight: 600; color: #475569; }
  td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }

  tr.status-pass { background: #f0fdf4; }
  tr.status-fail { background: #fef2f2; }
  tr.status-skip { background: #fffbeb; }
  tr:hover { background: #f8fafc; }
  tr.status-pass:hover { background: #dcfce7; }
  tr.status-fail:hover { background: #fee2e2; }
  tr.status-skip:hover { background: #fef9c3; }

  .num { font-weight: 700; color: #0f3d5c; width: 60px; }
  .title-col { max-width: 300px; }
  .url-col { max-width: 400px; }
  .url-col a {
    color: #1d4ed8;
    text-decoration: none;
    word-break: break-all;
    font-size: 0.8rem;
  }
  .url-col a:hover { text-decoration: underline; }

  .actions { white-space: nowrap; }
  .btn {
    padding: 4px 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    margin-right: 4px;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.8; }
  .btn-pass { background: #16a34a; color: white; }
  .btn-fail { background: #dc2626; color: white; }
  .btn-skip { background: #d97706; color: white; }
  .btn-clear { background: #94a3b8; color: white; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 700;

  .badge-pass { background: #dcfce7; color: #15803d; }

  .badge-skip { background: #fef9c3; color: #92400e; }

    font-weight: 700;

  #no-results { text-align: center; padding: 40px; color: #94a3b8; }
</style>

// ── URL builder (mirrors getHymnUrl in hymns.js) ───────────────────────────
function getHymnUrl(num) {
  const h = HYMNS[num];
  if (!h) return null;
  if (h.slug) {
    return `https://www.churchofjesuschrist.org/study/music/hymns-for-home-and-church/${h.slug}?lang=eng`;
  }
  return `https://www.churchofjesuschrist.org/music/library/hymns/${num}?lang=eng`;
}

// ── Persistence ────────────────────────────────────────────────────────────
const STORE_KEY = 'hymnTestResults';
let results = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(results));
}
function setStatus(num, status) {
  if (status === 'clear') delete results[num];
  else results[num] = status;
  save();
  render();
}
function resetAll() {
  if (!confirm('Reset all test results?')) return;
  results = {};
  save();
  render();
}

// ── Sections ───────────────────────────────────────────────────────────────
const SECTIONS = [
  { label: 'Classic Hymns: Restoration (1–61)', from: 1, to: 61 },
  { label: 'Classic Hymns: Praise & Thanksgiving (62–96)', from: 62, to: 96 },
  { label: 'Classic Hymns: Prayer & Supplication (97–168)', from: 97, to: 168 },
  { label: 'Classic Hymns: Sacrament (169–196)', from: 169, to: 196 },
  { label: 'Classic Hymns: Easter (197–200)', from: 197, to: 200 },
  { label: 'Classic Hymns: Christmas (201–214)', from: 201, to: 214 },
  { label: 'Classic Hymns: Special Topics (215–298)', from: 215, to: 298 },
  { label: 'Classic Hymns: Children\'s Songs (299–308)', from: 299, to: 308 },
  { label: 'Classic Hymns: For Women (309–318)', from: 309, to: 318 },
  { label: 'Classic Hymns: For Men (319–337)', from: 319, to: 337 },
  { label: 'Classic Hymns: Patriotic (338–341)', from: 338, to: 341 },
  { label: 'New Hymns: Batch 1 (1001–1018)', from: 1001, to: 1018 },
  { label: 'New Hymns: Batch 2 (1019–1031)', from: 1019, to: 1031 },
  { label: 'New Hymns: Batch 3 (1032–1050)', from: 1032, to: 1050 },
  { label: 'New Hymns: Batch 4 (1051–1062)', from: 1051, to: 1062 },
  { label: 'New Hymns: Batch 5 (1063–1072)', from: 1063, to: 1072 },
  { label: 'New Hymns: Seasonal (1201–1210)', from: 1201, to: 1210 },
];

function sectionFor(num) {
  return SECTIONS.find(s => num >= s.from && num <= s.to);
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  const search  = document.getElementById('search').value.toLowerCase();
  const filter  = document.getElementById('filter').value;
  const tbody   = document.getElementById('tbody');
  const noRes   = document.getElementById('no-results');

  const all = Object.keys(HYMNS).map(Number).sort((a, b) => a - b);

  let counts = { pass: 0, fail: 0, skip: 0, total: all.length };
  all.forEach(n => {
    const s = results[n];
    if (s === 'pass') counts.pass++;
    else if (s === 'fail') counts.fail++;
    else if (s === 'skip') counts.skip++;
  });
  const untested = counts.total - counts.pass - counts.fail - counts.skip;

  document.getElementById('stat-total').textContent    = `Total: ${counts.total}`;
  document.getElementById('stat-untested').textContent = `Untested: ${untested}`;
  document.getElementById('stat-pass').textContent     = `✓ Pass: ${counts.pass}`;
  document.getElementById('stat-fail').textContent     = `✗ Fail: ${counts.fail}`;
  document.getElementById('stat-skip').textContent     = `⊘ Skip: ${counts.skip}`;

  const pct = n => counts.total ? ((n / counts.total) * 100).toFixed(1) + '%' : '0%';
  document.getElementById('bar-pass').style.width = pct(counts.pass);
  document.getElementById('bar-fail').style.width = pct(counts.fail);
  document.getElementById('bar-skip').style.width = pct(counts.skip);

  const visible = all.filter(num => {
    const h = HYMNS[num];
    const s = results[num] || 'untested';
    if (filter !== 'all' && s !== filter) return false;
    if (search) {
      if (!String(num).includes(search) && !h.title.toLowerCase().includes(search)) return false;
    }
    return true;
  });

  if (visible.length === 0) {
    tbody.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  let html = '';
  let lastSection = null;
  visible.forEach(num => {
    const h   = HYMNS[num];
    const url = getHymnUrl(num);
    const s   = results[num] || 'untested';
    const sec = sectionFor(num);

    if (sec && sec !== lastSection) {
      html += `<tr class="section-header"><td colspan="5">${sec.label}</td></tr>`;
      lastSection = sec;
    }

    const badge = s === 'pass'   ? '<span class="badge badge-pass">PASS</span>'
                : s === 'fail'   ? '<span class="badge badge-fail">FAIL</span>'
                : s === 'skip'   ? '<span class="badge badge-skip">SKIP</span>'
                : '—';
    const isNew  = num >= 1000 ? '<span class="badge badge-new">NEW</span> ' : '';

    html += `<tr class="status-${s}" id="row-${num}">
      <td class="num">${num}</td>
      <td class="title-col">${isNew}${h.title}</td>
      <td class="url-col"><a href="${url}" target="_blank" rel="noopener">${url}</a></td>
      <td>${badge}</td>
      <td class="actions">
        <button class="btn btn-pass"  onclick="setStatus(${num},'pass')">Pass</button>
        <button class="btn btn-fail"  onclick="setStatus(${num},'fail')">Fail</button>
        <button class="btn btn-skip"  onclick="setStatus(${num},'skip')">Skip</button>
        <button class="btn btn-clear" onclick="setStatus(${num},'clear')">Clear</button>
      </td>
    </tr>`;
  });

  tbody.innerHTML = html;
}

render();
</script>
